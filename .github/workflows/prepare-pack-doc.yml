name: Prepare Pack Documentation
on:
  push:
    branches: [codex/typed-view-contracts]
    paths: ['.github/workflows/prepare-pack-doc.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare the allowlist blob without changing any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          assert os.environ['GITHUB_REPOSITORY'] == 'seo-rii/active-ts'
          p = 'test/pack-smoke.mjs'
          data = pathlib.Path(p).read_bytes()
          def sha(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert sha(data) == 'be565161a106e71beea21d7d901b8b42c4952256'
          old = b"\t\t\t'docs/testing.md'\n\t\t].includes(file)"
          new = b"\t\t\t'docs/testing.md',\n\t\t\t'docs/typed-views.md'\n\t\t].includes(file)"
          assert data.count(old) == 1
          data = data.replace(old, new)
          request = urllib.request.Request('https://api.github.com/repos/seo-rii/active-ts/git/blobs', data=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}, method='POST')
          with urllib.request.urlopen(request) as response:
              result = json.load(response)
          assert result['sha'] == sha(data)
          print('PREPARED_BLOB='+result['sha'])
          PY
