name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish package to npm after checks pass
        required: true
        type: boolean
        default: false

jobs:
  reject-publish-ref:
    if: ${{ inputs.publish && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - run: |
          echo "Publishing is only allowed from refs/heads/main." >&2
          exit 1

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16@sha256:ab47a724d0e37131ac950b98ff2beeb3fdb3bfcc592d73c6cc4b4e7626649671
        env:
          POSTGRES_DB: active_ts
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d active_ts"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7@sha256:33d7c9a245edd95e6703a0addbeaa48fe40c3b3b4783627a72085155462ebfdb
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
        ports:
          - 6380:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3@sha256:01c1732062b4a846c5ca687b0094b89bad0bfed00c6d71626db32fb8f3131a78
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s"
          --health-interval 15s
          --health-timeout 5s
          --health-retries 10
      opensearch:
        image: opensearchproject/opensearch:3.9.0@sha256:adfa61f85025d06b4aeb562e7e74fde7e31c437039c93c3862c17e9acebd6c7c
        env:
          discovery.type: single-node
          node.store.allow_mmap: 'false'
          DISABLE_INSTALL_DEMO_CONFIG: 'true'
          DISABLE_SECURITY_PLUGIN: 'true'
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9201:9200
        options: >-
          --health-cmd "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s'"
          --health-interval 15s
          --health-timeout 5s
          --health-retries 10
      meilisearch:
        image: getmeili/meilisearch:v1.55.0@sha256:ff546679970126f8822e15d1b6a06bfbff1f2ce2e43f810cfb5258012f92de5c
        env:
          MEILI_ENV: development
          MEILI_NO_ANALYTICS: 'true'
          # Public fixture credential for this disposable CI service only.
          MEILI_MASTER_KEY: active-ts-public-integration-only-master-key
        ports:
          - 7700:7700
        options: >-
          --health-cmd "curl -fsS http://localhost:7700/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/active_ts
      MONGODB_URL: mongodb://127.0.0.1:27017/?replicaSet=active-ts-rs
      REDIS_URL: redis://127.0.0.1:6379
      VALKEY_URL: redis://127.0.0.1:6380
      ELASTICSEARCH_URL: http://127.0.0.1:9200
      MEILISEARCH_URL: http://127.0.0.1:7700
      MEILISEARCH_API_KEY: active-ts-public-integration-only-master-key
      ACTIVE_TS_MEILISEARCH_REQUIRE_AUTH: 'true'
      OPENSEARCH_URL: http://127.0.0.1:9201
      DATASTORE_EMULATOR_HOST: 127.0.0.1:8081
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8082
      GOOGLE_CLOUD_PROJECT: active-ts-emulator
      GCLOUD_PROJECT: active-ts-emulator
      ACTIVE_TS_INTEGRATION_TARGETS: postgres,mongodb,redis,elasticsearch,datastore,firestore,sqlite,valkey,meilisearch,opensearch
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Test the locked package-manager bootstrap
        run: node --test scripts/setup-pnpm.test.mjs
      - name: Install and audit the exact package manager before executing it
        run: node scripts/setup-pnpm.mjs
      - name: Start MongoDB replica set
        run: |
          docker run --detach --rm --name active-ts-mongodb --publish 27017:27017 \
            mongo:7@sha256:948b635bc126d62274eebb650dd2e2e66c9abc3bb0a336eb2279a5d8489417f5 \
            --replSet active-ts-rs --bind_ip_all
          for attempt in $(seq 1 60); do
            if docker exec active-ts-mongodb mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs active-ts-mongodb
              exit 1
            fi
            sleep 1
          done
          docker exec active-ts-mongodb mongosh --quiet --eval \
            'rs.initiate({ _id: "active-ts-rs", members: [{ _id: 0, host: "127.0.0.1:27017" }] })'
          for attempt in $(seq 1 60); do
            if docker exec active-ts-mongodb mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs active-ts-mongodb
              exit 1
            fi
            sleep 1
          done
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: 505.0.0
          install_components: beta,cloud-datastore-emulator,cloud-firestore-emulator
      - run: pnpm install --frozen-lockfile
      - run: pnpm run audit
      - run: pnpm typecheck
      - run: pnpm test
      - name: Start Google Cloud emulators
        run: |
          gcloud config set project "$GOOGLE_CLOUD_PROJECT"
          gcloud beta emulators datastore start --project="$GOOGLE_CLOUD_PROJECT" --host-port="$DATASTORE_EMULATOR_HOST" --no-store-on-disk --consistency=1.0 > "$RUNNER_TEMP/datastore-emulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/datastore-emulator.pid"
          gcloud emulators firestore start --project="$GOOGLE_CLOUD_PROJECT" --host-port="$FIRESTORE_EMULATOR_HOST" > "$RUNNER_TEMP/firestore-emulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/firestore-emulator.pid"
          node --input-type=module <<'NODE'
          import { Datastore } from '@google-cloud/datastore';
          import { Firestore } from '@google-cloud/firestore';

          const projectId = process.env.GOOGLE_CLOUD_PROJECT;

          async function waitFor(name, probe) {
            let lastError;
            for (let attempt = 1; attempt <= 60; attempt++) {
              try {
                await probe();
                return;
              } catch (error) {
                lastError = error;
                await new Promise((resolve) => setTimeout(resolve, 1000));
              }
            }
            throw new Error(`${name} emulator did not become ready: ${lastError?.message ?? lastError}`);
          }

          const datastore = new Datastore({ projectId });
          const datastoreKey = datastore.key({
            namespace: 'active_ts_readiness',
            path: ['readiness', 'probe']
          });
          await waitFor('Datastore', async () => {
            await datastore.save({ key: datastoreKey, data: { ok: true } });
            const [entity] = await datastore.get(datastoreKey);
            if (!entity?.ok) throw new Error('Datastore probe read failed');
            await datastore.delete(datastoreKey);
          });

          const firestore = new Firestore({ projectId });
          try {
            const ref = firestore.collection('active_ts_readiness').doc('probe');
            await waitFor('Firestore', async () => {
              await ref.set({ ok: true });
              const snap = await ref.get();
              if (!snap.exists || snap.data()?.ok !== true) throw new Error('Firestore probe read failed');
              await ref.delete();
            });
          } finally {
            await firestore.terminate();
          }
          NODE
      - run: pnpm test:integration:backends
      - name: Test release manifest verification
        run: node --test scripts/prepare-package.test.mjs scripts/release-artifact.test.mjs test/packed-artifact.test.mjs
      - name: Prepare identifiable release artifact
        id: artifact
        run: |
          node scripts/release-artifact.mjs create "$RUNNER_TEMP/active-ts-release" --require-clean
          node -e 'const fs = require("node:fs"); const path = require("node:path"); const m = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, "active-ts-release/release-manifest.json"))); fs.appendFileSync(process.env.GITHUB_OUTPUT, "filename=" + m.artifact.filename + "\n");'
      - run: pnpm pack:smoke
        env:
          ACTIVE_TS_PACKAGE_TARBALL: ${{ runner.temp }}/active-ts-release/${{ steps.artifact.outputs.filename }}
      - name: Retain the tested tarball and source manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: active-ts-release-${{ github.sha }}
          path: ${{ runner.temp }}/active-ts-release/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: release
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Download the tested artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: active-ts-release-${{ github.sha }}
          path: ${{ runner.temp }}/active-ts-release/
      - name: Verify artifact identity before publishing
        id: artifact
        run: |
          node scripts/release-artifact.mjs verify "$RUNNER_TEMP/active-ts-release" --require-clean
          node -e 'const fs = require("node:fs"); const path = require("node:path"); const m = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, "active-ts-release/release-manifest.json"))); fs.appendFileSync(process.env.GITHUB_OUTPUT, "filename=" + m.artifact.filename + "\n");'
      - run: npm publish "$RELEASE_TARBALL" --provenance --access public
        env:
          RELEASE_TARBALL: ${{ runner.temp }}/active-ts-release/${{ steps.artifact.outputs.filename }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
