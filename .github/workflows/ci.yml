name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Test the locked package-manager bootstrap
        run: node --test scripts/setup-pnpm.test.mjs
      - name: Install and audit the exact package manager before executing it
        run: node scripts/setup-pnpm.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm run audit
      - run: node --test scripts/prepare-package.test.mjs scripts/release-artifact.test.mjs
      - name: Check the generated active risk register
        run: node --test scripts/render-risk-register.test.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - run: node --test test/packed-artifact.test.mjs
      - run: pnpm pack:smoke
